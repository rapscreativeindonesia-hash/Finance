<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071410">
<meta name="robots" content="noindex,nofollow">
<title>Finance · Keuangan Pribadi</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
<script src="/app.js" defer></script>
</head>
<body>
<div class="shell">
<aside class="sidebar">
 <div class="brand"><span class="logo">▥</span><span><strong>FINANCE</strong><small>KEUANGAN PRIBADI</small></span></div>
 <p class="side-caption">MENU</p><nav id="nav"></nav>
 <div class="side-footer">● Data disimpan di perangkat<br><small>Ekspor backup secara berkala</small></div>
</aside>
<div class="content">
<header class="header"><div><small>PERSONAL FINANCE TRACKER</small><h1 id="title">Beranda</h1><p id="subtitle"></p></div><div class="actions"><input id="month" type="month" aria-label="Pilih periode"><button id="mask" class="btn ghost" aria-label="Sembunyikan nominal">◉</button><div class="avatar">RH</div></div></header>
<main id="app"></main>
<nav id="mobile-nav" class="mobile-nav"></nav>
</div>
</div>
<dialog id="dialog"><form id="form"><div class="between"><h2 id="dialog-title">Tambah</h2><button type="button" id="close" class="close">×</button></div><div id="fields"></div><div class="dialog-actions"><button type="button" id="cancel" class="btn ghost">Batal</button><button class="btn primary" type="submit">Simpan</button></div></form></dialog>
<input type="file" id="import" accept=".json,application/json" hidden>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
